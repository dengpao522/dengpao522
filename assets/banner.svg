<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <!-- 深蓝科技底色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.5" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#141d38"/>
    </linearGradient>
    <!-- 流动光带渐变 -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#BC8CFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 网格 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <!-- 标题渐变字 -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#c9d8ff;#ffffff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8AB4FF">
        <animate attributeName="stop-color" values="#8AB4FF;#BC8CFF;#8AB4FF" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- 背景 + 网格 -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <!-- 数字雨：黑客帝国效果 -->
  <g font-family="monospace" font-size="13" opacity="0.5">
    <text x="30" y="-20" fill="#22D3EE">1011<tspan dy="16" fill-opacity="0.5">A0</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 330" dur="9s" repeatCount="indefinite"/></text>
    <text x="150" y="-60" fill="#58A6FF">Z3<tspan dy="15" fill-opacity="0.5">9D</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 340" dur="11s" repeatCount="indefinite"/></text>
    <text x="290" y="-30" fill="#22D3EE">0F11<tspan dy="15" fill-opacity="0.45">2</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 320" dur="8s" repeatCount="indefinite"/></text>
    <text x="430" y="-70" fill="#BC8CFF">A70<tspan dy="16" fill-opacity="0.4">C3</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 350" dur="12s" repeatCount="indefinite"/></text>
    <text x="720" y="-25" fill="#22D3EE">D08<tspan dy="15" fill-opacity="0.45">1A</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 340" dur="8.5s" repeatCount="indefinite"/></text>
    <text x="860" y="-65" fill="#BC8CFF">7E01<tspan dy="16" fill-opacity="0.15">F</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 350" dur="11.5s" repeatCount="indefinite"/></text>
    <text x="1010" y="-35" fill="#58A6FF">0110<tspan dy="15" fill-opacity="0.4">9C</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 330" dur="9.5s" repeatCount="indefinite"/></text>
    <text x="1130" y="-55" fill="#22D3EE">A1<tspan dy="15" fill-opacity="0.4">0F</tspan><animateTransform attributeName="transform" type="translate" values="0 0;0 340" dur="10.5s" repeatCount="indefinite"/></text>
  </g>
  <!-- HUD 四角框线 -->
  <g stroke="#22D3EE" stroke-opacity="0.45" fill="none" stroke-width="1.5">
    <path d="M18 44 V18 H44"/><path d="M1156 18 H1182 V44"/><path d="M1182 236 V262 H1156"/><path d="M44 262 H18 V236"/>
  </g>
  <!-- 电弧脉冲 -->
  <path d="M430 170 L470 166 L500 173 L540 167" stroke="#7DF9FF" stroke-width="1.2" fill="none" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.9;0;0;0" dur="5s" repeatCount="indefinite" begin="0.5s"/></path>
  <path d="M660 170 L700 167 L730 173 L770 168" stroke="#BC8CFF" stroke-width="1.2" fill="none" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0;0.85;0;0" dur="5s" repeatCount="indefinite" begin="2.1s"/></path>
  <!-- 底部能量条 -->
  <rect x="500" y="262" width="200" height="4" rx="2" fill="#58A6FF" fill-opacity="0.12"/>
  <rect x="500" y="262" width="0" height="4" rx="2" fill="#22D3EE" fill-opacity="0.8"><animate attributeName="width" values="0;200;200;0" dur="6s" repeatCount="indefinite"/></rect>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- 流动扫描光带：从左到右循环 -->
  <rect x="-260" y="0" width="260" height="280" fill="url(#beam)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 1500 0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- 装饰：半透明代码符号 -->
  <text x="60" y="70" font-size="22" fill="#58A6FF" fill-opacity="0.18" font-family="monospace">&lt;/&gt;</text>
  <text x="1060" y="240" font-size="22" fill="#BC8CFF" fill-opacity="0.18" font-family="monospace">{ }</text>
  <text x="980" y="60" font-size="15" fill="#58A6FF" fill-opacity="0.14" font-family="monospace">01011010</text>
  <text x="120" y="230" font-size="15" fill="#BC8CFF" fill-opacity="0.12" font-family="monospace">agent.run()</text>

  <!-- 闪烁粒子（不同节奏，制造星空感） -->
  <circle cx="220" cy="80" r="2.5" fill="#58A6FF">
    <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="215" r="2" fill="#BC8CFF">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="60" r="2.2" fill="#22D3EE">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="200" r="2.6" fill="#58A6FF">
    <animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="120" r="1.8" fill="#BC8CFF">
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="150" r="1.6" fill="#8AB4FF">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.1s" repeatCount="indefinite"/>
  </circle>

  <!-- 主标题：渐变流动字 -->
  <text x="600" y="138" text-anchor="middle" font-size="58" font-weight="700" fill="url(#titleGrad)">Sean 赵建辉</text>

  <!-- 分隔装饰线 -->
  <line x1="440" y1="168" x2="760" y2="168" stroke="#58A6FF" stroke-opacity="0.35" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="440" cy="168" r="3" fill="#58A6FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="168" r="3" fill="#BC8CFF">
    <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 副标题 -->
  <text x="600" y="205" text-anchor="middle" font-size="22" fill="#9DB8FF">Agent 开发 · Vibe Coding 开发</text>

  <!-- 标语 -->
  <text x="600" y="242" text-anchor="middle" font-size="15" fill="#6E7A96">把 AI 能力做成真正可用的产品</text>

  <!-- 底部渐变收边 -->
  <rect x="0" y="274" width="1200" height="6" fill="url(#beam)"/>
</svg>
